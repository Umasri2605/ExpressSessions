<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .price {
      color: green;
      font-weight: bold;
      margin: 8px 0;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <h1>Products</h1>

  <div class="products" id="d1"></div>

  <script>
    const prod = document.getElementById("d1");
      
    fetch("https://fakestoreapi.com/products")
      .then(res => res.json())
      .then(products => {
        products.forEach(product => {
          prod.innerHTML += `
            <div class="card">
              <img src="${product.image}" alt="${product.title}">
              <h3>${product.title.slice(0,15)}</h3>
              <p class="price">$${product.price}</p>
              <button>Add to Cart</button>
            </div>
          `;
        });
      })
      .catch(err => {
        console.error("Error fetching products:", err);
      });
  </script>
</body>
</html>

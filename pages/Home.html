<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background:gray;
      color: white;
      padding: 7px;
      text-align: center; 
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
      font-size: 18px;
    }

    .hero button {
      margin-top: 25px;
      padding: 12px 25px;
      font-size: 16px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .hero button:hover {
      background: #084298;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .feature-card {
      background: white;
      padding: 20px;
      width: 250px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #e9ecef;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h2>🛒 My Products Store</h2>
  </header>

  <section class="hero">
    <h1>Welcome to Our Store</h1>
    <p>Explore high-quality products at the best prices</p>
    <button onclick="goToProducts()">View Products</button>
  </section>

  <section class="features">
    <div class="feature-card">
      <h3>✔ Quality</h3>
      <p>Top-rated and trusted products</p>
    </div>
    <div class="feature-card">
      <h3>🚚 Fast Delivery</h3>
      <p>Quick and safe shipping</p>
    </div>
    <div class="feature-card">
      <h3>💳 Secure Payment</h3>
      <p>100% secure transactions</p>
    </div>
  </section>

  <footer>
    © 2026 My Products Store
  </footer>

  <script>
    function goToProducts() {
      window.location.href = "/products";
    }
  </script>

</body>
</html>
